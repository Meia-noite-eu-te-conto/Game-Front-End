name: image

# Constrói a imagem do front-end, verifica que ela realmente serve os estáticos, e
# só então publica.
#
# Requer o secret GHCR_TOKEN — PAT clássico com escopo write:packages, definido como
# secret da ORGANIZAÇÃO (Settings → Secrets and variables → Actions) para os três
# repositórios compartilharem um só.
#
# Por que não o GITHUB_TOKEN automático: ele só publica pacotes do dono do
# repositório, ou seja em ghcr.io/meia-noite-eu-te-conto/*. As imagens vão para
# ghcr.io/davypaulino/*, que é o namespace que o cluster já usa.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/davypaulino/pong-front-end

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{raw}} preserva o "v" do tag git (v0.1.0), que é a forma usada nos
          # manifests e pelo routine-api. {{version}} sozinho geraria 0.1.0 e a
          # imagem não seria encontrada.
          # Sem `latest`: com imagePullPolicy IfNotPresent, uma tag móvel faz o nó
          # rodar imagem em cache sem avisar.
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A config do nginx NÃO está na imagem: vem do ConfigMap `front-end-nginx`
      # (manifests/01-configmap.yaml). O teste monta uma equivalente para provar
      # que a imagem serve o conteúdo e devolve 404 no que não existe.
      - name: smoke test
        run: |
          set -euo pipefail

          # os estáticos chegaram à imagem?
          docker run --rm ${{ env.IMAGE }}:ci test -f /usr/share/nginx/html/index.html
          docker run --rm ${{ env.IMAGE }}:ci test -f /usr/share/nginx/html/assets/js/Enums.js

          cat > /tmp/default.conf <<'CONF'
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              location = /healthz { access_log off; return 200 "ok\n"; }
              location / { try_files $uri $uri/ =404; }
          }
          CONF

          docker run -d --name fe -v /tmp/default.conf:/etc/nginx/conf.d/default.conf:ro \
            ${{ env.IMAGE }}:ci
          trap 'docker rm -f fe >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            docker exec fe wget -q -O /dev/null http://127.0.0.1/healthz && break
            sleep 1
          done

          check() {
            code=$(docker exec fe wget -q -S -O /dev/null "http://127.0.0.1$1" 2>&1 \
                   | grep -m1 'HTTP/' | awk '{print $2}' || true)
            : "${code:=404}"
            [ "$code" = "$2" ] || { echo "$1: esperado $2, obtido $code"; exit 1; }
            echo "  $1 -> $code"
          }
          check /healthz 200
          check / 200
          check /assets/js/Enums.js 200
          # 404, não 200 com index.html dentro: fallback de SPA mascararia asset
          # ausente, e o erro apareceria como falha de parse de JavaScript.
          check /nao-existe 404

      - name: login no ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: davypaulino
          password: ${{ secrets.GHCR_TOKEN }}

      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
